name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'رابط الموقع (اتركه فاضي ليتسحب تلقائياً من الريبو)'
        required: false
        default: ''
      app_name:
        description: 'اسم التطبيق'
        required: false
        default: 'JMG | مروج'
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read
  pages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # رابط الموقع بيتسحب لوحده: من إعدادات GitHub Pages (يشمل الدومين المخصص)، وإلا من اسم المستخدم والريبو
      - name: Detect site URL
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ github.event.inputs.site_url }}
          INPUT_NAME: ${{ github.event.inputs.app_name }}
        run: |
          URL="$INPUT_URL"
          if [ -z "$URL" ]; then
            URL=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url' 2>/dev/null || true)
          fi
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
            REPO="${GITHUB_REPOSITORY#*/}"
            if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER.github.io" ]; then
              URL="https://$OWNER.github.io/"
            else
              URL="https://$OWNER.github.io/$REPO/"
            fi
          fi
          case "$URL" in */) ;; *) URL="$URL/" ;; esac
          NAME="${INPUT_NAME:-JMG | مروج}"
          echo "START_URL=$URL" >> "$GITHUB_ENV"
          echo "APP_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Site URL: $URL"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug -PversionCode=${{ github.run_number }} -PstartUrl="$START_URL" -PappName="$APP_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MURUJ-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
