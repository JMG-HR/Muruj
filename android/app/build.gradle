plugins {
    id 'com.android.application'
}

// رابط الموقع واسم التطبيق بيجوا تلقائياً من GitHub Actions (-PstartUrl / -PappName). القيم دي بس للبناء المحلي.
def startUrl = (project.findProperty('startUrl') ?: 'https://jmg-hr.github.io/-Muruj_test/').toString()
def appName  = (project.findProperty('appName')  ?: 'JMG | مروج').toString()
def vCode    = Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())

android {
    namespace 'com.jmg.muruj'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jmg.muruj'   // غيّره لكل شركة (مثال: com.company.app)
        minSdk 24
        targetSdk 35
        versionCode vCode
        versionName '1.0'
        resValue 'string', 'start_url', startUrl
        resValue 'string', 'app_name', appName
    }
    buildTypes {
        release { minifyEnabled false }
    }
    // البناء بيتم بـ JDK 21. مستوى لغة الكود 17 لأنه أعلى مستوى بيدعمه أندرويد حالياً.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
